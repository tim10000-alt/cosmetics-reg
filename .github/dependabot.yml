version: 2
# 보안·버전 업데이트를 PR 로 자동 제안(자동 머지 X — 사람 검토 후 병합).
# PR 은 pr-check.yml(tsc·lint·build·E2E) 게이트를 거치므로 깨지는 업데이트는 걸러짐.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # eslint 10 보류: eslint-config-next@16.2.7(최신 stable)가 번들한
      # eslint-plugin-react@7.37.5(최신)의 peer 가 eslint "...||^9.7" 로 capped —
      # eslint 10 에서 rule 로드 시 contextOrFilename.getFilename 크래시(upstream 미지원).
      # 생태계(plugin-react/config-next)가 eslint 10 지원 시 이 ignore 제거 후 재시도.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    groups:
      # 자잘한 patch/minor 는 묶어서 PR 수 줄임.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
