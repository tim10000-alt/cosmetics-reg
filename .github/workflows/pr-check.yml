name: PR Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  static:
    name: 타입 + 린트
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: tsc noEmit
        run: npx tsc --noEmit
      - name: eslint (사용자 코드)
        run: npx eslint .

  e2e:
    name: 정적 빌드 + E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: static
    # Phase 5b — Supabase 의존 0. public/data/*.json 가 repo 에 포함되어 자격증명 불필요.
    # 🔴 2026-06-08: `npx playwright install --with-deps chromium` 가 ubuntu-latest 에서 매 run
    # 15분 hang → job timeout cancel(최근 6/6 run = E2E 게이트가 조용히 죽어 있었음. watchdog 은
    # 데이터 freshness 만 봐서 미감지). 근본 해결 = 브라우저+시스템 의존성이 baked-in 된 공식
    # Playwright 컨테이너로 실행해 install 단계 자체를 제거(npm playwright 버전 == 컨테이너 태그 핀).
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy
    env:
      E2E_BASE: http://localhost:3010
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Build static site (out/)
        run: npm run build
      - name: Serve out/ on :3010 (background)
        run: |
          npx --yes serve out -l 3010 &
          for i in {1..30}; do curl -sf http://localhost:3010/ >/dev/null && break; sleep 1; done
      - name: Run E2E scenarios
        run: npm run e2e
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shots-${{ github.run_id }}
          path: .e2e-shots/
          retention-days: 7
          if-no-files-found: ignore
