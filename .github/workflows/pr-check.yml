name: PR Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  static:
    name: 타입 + 린트
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: tsc noEmit
        run: npx tsc --noEmit
      - name: eslint (사용자 코드)
        run: npx eslint .

  e2e:
    name: 정적 빌드 + E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: static
    # Phase 5b — Supabase 의존 0. public/data/*.json 가 repo 에 포함되어 자격증명 불필요.
    # 🔴 2026-06-08: `npx playwright install --with-deps chromium` 가 ubuntu-latest 에서 매 run
    # 15분 hang → job timeout cancel(최근 6/6 run = E2E 게이트가 조용히 죽어 있었음. watchdog 은
    # 데이터 freshness 만 봐서 미감지). 근본 해결 = 브라우저+시스템 의존성이 baked-in 된 공식
    # Playwright 컨테이너로 실행해 install 단계 자체를 제거(npm playwright 버전 == 컨테이너 태그 핀).
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy
    env:
      E2E_BASE: http://localhost:3010
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Build static site (out/)
        run: npm run build
      # serve + e2e 를 한 스텝에서 — 컨테이너에선 별도 step 의 background serve 가 step 경계(셸 종료)
      # 에서 종료신호를 받아 테스트 중간에 죽음(라이브 run 157004b: T1~T19 통과 후 line187서
      # ERR_CONNECTION_REFUSED). 같은 셸 안에 두면 e2e 종료까지 serve 생존. (셸이 sh 라 brace
      # expansion 미작동 → seq 사용.)
      - name: Serve out/ on :3010 + E2E
        run: |
          npx --yes serve out -l 3010 &
          SERVE_PID=$!
          for i in $(seq 1 30); do curl -sf http://localhost:3010/ >/dev/null && break; sleep 1; done
          npm run e2e
          kill $SERVE_PID 2>/dev/null || true
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-shots-${{ github.run_id }}
          path: .e2e-shots/
          retention-days: 7
          if-no-files-found: ignore
