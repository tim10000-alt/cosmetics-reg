name: Daily Data Refresh

on:
  schedule:
    - cron: "17 18 * * *"   # 매일 KST 03:17
  workflow_dispatch:
  # crawl.yml 자체 변경 시 즉시 1회 trigger (workflow_dispatch UI 가 push 직후 인식 지연되는 케이스 보완).
  push:
    branches: [main]
    paths:
      - '.github/workflows/crawl.yml'
      - 'scripts/fetchers/**'

# Phase 5b — Supabase 의존 0. 데이터 갱신 후 public/data/*.json 변경분을 git commit + push.
# 정적 호스팅(또는 사용자 git pull)이 자동으로 새 데이터 반영.

permissions:
  contents: write
  issues: write   # 데이터 품질 회귀 시 Issue 자동 생성

# enrich.yml 과 동일 그룹 — 두 일일 writer(crawl/enrich)가 ingredients.json 을
# 동시에 push 하다 rebase 충돌로 enrich commit 이 실패하던 race 방지.
# concurrency group 은 같은 그룹을 선언한 워크플로우끼리만 직렬화되므로 양쪽 모두 선언해야 함.
# 90분 crawl 이 enrich(KST 04:00) 와 겹쳐도 enrich 가 큐잉돼 crawl 완료 후 깨끗이 실행.
concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Playwright + 20여 fetcher + (throttle) Gemini 파싱. 실측 ~85분(90 한계 근접) → commit 전
    # timeout 으로 가디언 클린이 커밋 안 될 위험 → 120분 여유(durability). 상한일 뿐 빨리 끝나면 종료.
    # public repo 라 Actions 분 비용 없음.
    timeout-minutes: 120
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MFDS_API_KEY: ${{ secrets.MFDS_API_KEY }}
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          # GH_PAT 가 있으면 그 토큰으로 push → 봇 커밋이 "사람 활동"으로 집계돼
          # 60일 무활동 시 스케줄 자동 disable 을 방지. 없으면 기본 토큰으로 정상 동작.
          # ⚠️ GH_PAT 요건: fine-grained + 이 repo + **Contents: Read and write**.
          #    (read-only PAT 를 넣으면 push 가 거부되어 commit 단계 실패 — 정품검증 발견 #2.)
          token: ${{ secrets.GH_PAT || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci

      # 1) MFDS 공공데이터 4종 → public/data/{ingredients,regulations,countries,meta}.json
      # continue-on-error: MFDS API 일시 장애/키 문제로 실패해도 job 을 멈추지 않고
      # 나머지 fetcher + commit 단계까지 도달하게 함(부분 갱신 보존). 실패는 로그에 남음.
      - name: Ingest MFDS public-data APIs
        id: mfds
        run: npm run mfds:ingest
        continue-on-error: true

      # continue-on-error 로 인해 MFDS 실패가 런 배지(초록)에 묻히는 것 방지 —
      # job 을 실패시키지 않으면서 경고 주석만 남김(워치독과 별개의 즉시 신호).
      - name: Flag MFDS ingest failure (job 은 계속)
        if: steps.mfds.outcome == 'failure'
        run: echo "::warning title=MFDS ingest 실패::오늘 MFDS 인입 실패 — 다른 소스로는 진행하나 KR 공정서 갱신 누락. 키 만료/소스 장애 점검 필요."

      # 2) 각국 1차 소스 (각 fetcher 는 in-place 머지 — 같은 source_document 행만 교체)
      - name: Refresh US FDA 21 CFR 700 (eCFR API)
        run: npm run us:ingest
        continue-on-error: true

      # US 색소 positive list (Part 73 Subpart C 인증면제 + Part 74 Subpart C 인증요구)
      # + California AB 2762 (24 banned, 2025-01-01 발효).
      - name: Refresh US 21 CFR 73/74 Subpart C 색소 + California AB 2762
        run: npm run us:colors
        continue-on-error: true

      # --with-deps 의 apt 단계가 간헐적으로 hang 하여 전체 파이프라인을 잡아먹음(run #1·#2
      # 실측). 단계 타임아웃 8분 + continue-on-error 로 격리 — 행/실패해도 죽이고 진행.
      # Chromium 미설치 시 CN IECIC(Playwright 필요)만 그 런에서 skip, 데이터는 보존됨.
      - name: Install Playwright Chromium for fetcher
        run: npx playwright install --with-deps chromium
        timeout-minutes: 8
        continue-on-error: true

      - name: Refresh CN NMPA IECIC (Playwright)
        run: npm run cn:iecic
        continue-on-error: true

      # CN IECIC 2025-04-13 update (KCIA 16818 별표 xlsx) — 8935 ingredient × chinese_name.
      # Playwright IECIC fetcher 와 coexist — chinese_name 보강 + 신규 ingredient 만 add.
      - name: CN IECIC 2025 한국어 번역본 (KCIA 16818) — chinese_name 보강
        run: npm run cn:iecic-kcia
        continue-on-error: true

      # KCIA 게시물 metadata + 첨부 자동 다운로드. 14208 안전기술규범 등 비회원
      # 다운로드 가능 확인됨. 첨부 파일명에 timestamp 포함 → 변경 시 새 파일.
      # 새 게시물·새 개정공고 첨부도 자동 추가.
      - name: Refresh KCIA articles + 첨부 자동 다운로드
        run: npm run kcia:articles
        continue-on-error: true

      # CN NMPA 안전기술규범 — KCIA 14208 한국어 번역본 Excel(7표) 파싱.
      # 사용금지 + 사용제한 + 준용(positive list 4종) 1733 entries → CN 규제.
      # KCIA 첨부 자동 다운로드 step 직후 실행.
      - name: Parse CN NMPA 安全技术规范 (KCIA xlsx)
        run: npm run cn:safety
        continue-on-error: true

      # KCIA 게시물의 PDF/xlsx 첨부 Gemini 자동 파싱 — 14208 외 모든 게시물.
      # SHA256 fingerprint 비교 → 변경된 첨부만 처리.
      # 새 법령(중국·미국·브라질·콜롬비아 등 모든 KCIA 카테고리)이 KCIA 에 올라오면
      # 자동 발견 → 자동 다운 → Gemini 자동 파싱 → regulations.json 머지.
      # 무료 tier 안 (일 5 요청 미만 예상).
      - name: Parse KCIA 첨부 (Gemini 자동 — 14208 외 모든 게시물)
        run: npm run kcia:parse
        continue-on-error: true

      # ASEAN Cosmetic Directive — 6국 (VN/TH/ID/MY/PH/SG) fanout. 1차 출처.
      # PDF 자동 다운로드 + 정규식 직접 파싱 (Gemini 의존 0).
      - name: Parse ASEAN ACD Annex II/III/IV/VI/VII (6국 fanout)
        run: npm run asean:acd
        continue-on-error: true

      # BR ANVISA RDC — KCIA 15087 zip 첨부에서 RDC PDF 자동 추출 + 파싱.
      # RDC 83 (banned) + 03 (restricted) + 29 (preservatives) + 628 (colorants) + 600 (UV).
      - name: Parse BR ANVISA RDC (KCIA zip 경유)
        run: npm run br:anvisa
        continue-on-error: true

      - name: Refresh JP MHLW PDFs (auto download + hash diff)
        run: npm run jp:mhlw
        continue-on-error: true

      - name: Parse JP MHLW PDF (Appendix 1+3+4 → regulations)
        run: npm run jp:parse
        continue-on-error: true

      # JP MHLW 別表 1 (品目ごと承認対象成分 positive list, ~2643 종) — 105 page PDF.
      # 정규식 직접 (Gemini 0). 카테고리 (1)~(11) × 성분 매트릭스 → JP regulations.
      - name: Parse JP MHLW 別表 1 (品目ごと承認対象成分 positive list)
        run: npm run jp:annex1
        continue-on-error: true

      - name: Refresh TW TFDA preservative-restricted list
        run: npm run tw:tfda
        continue-on-error: true

      # GitHub Actions runner = 미국 IP. 한국 IP 차단된 정부 사이트 우회 시도.
      # 실패해도 데이터 자체엔 영향 X (continue-on-error).
      - name: Try CA Health Canada Hotlist (US-IP from runner)
        run: npm run ca:hotlist
        continue-on-error: true

      # 차단 사이트들의 메인 페이지 raw HTML 자동 저장 (분석 추후).
      # EU EUR-Lex — main text HTML (Annex 목차만) + consolidated PDF (Annex 본문 통합)
      - name: Try EU EUR-Lex 1223/2009 main HTML
        run: npm run fetch:try -- EU "https://eur-lex.europa.eu/eli/reg/2009/1223/oj/eng" eu_eurlex_1223
        continue-on-error: true

      # EU Annex II~VI — 깨끗한 통합본 HTML 결정론 파싱(한도·조건 포함). 깨진 PDF 파서
      # (eu:pdf/eu:parse)를 대체·제거 — HTML 이 한도까지 정확 추출하므로. Gemini 불필요·자동.
      - name: Parse EU EUR-Lex HTML (Annex II~VI 한도·조건)
        run: npm run eu:html
        continue-on-error: true

      # Andean Community (CO/EC/PE/BO) Decisión 833 — EU 규제 채택. EU parse 직후 fanout.
      - name: Fanout EU 1차 → Andean Community 4국 (CO/EC/PE/BO)
        run: npm run andean:fanout
        continue-on-error: true

      # KCIA(대한화장품협회) 성분사전 표준화명칭목록 — 한국 표준 성분명 2.2만건 ingest.
      # sha256 해시스킵(증분: 변경 시만 재머지)·멱등. 한글명 보강 + 깨끗한 영문 INCI 신규 추가.
      - name: Ingest KCIA standardized ingredient names
        run: npm run kcia:names
        continue-on-error: true

      - name: Try BR ANVISA cosmetics index
        run: npm run fetch:try -- BR "https://www.gov.br/anvisa/pt-br/assuntos/cosmeticos" br_anvisa_index
        continue-on-error: true

      - name: Try AR ANMAT cosmetics index
        run: npm run fetch:try -- AR "https://www.argentina.gob.ar/anmat/regulados/cosmeticos" ar_anmat_index
        continue-on-error: true

      - name: Try CN NMPA cosmetic regulations
        run: npm run fetch:try -- CN "https://www.nmpa.gov.cn/xxgk/fgwj/gzwj/gzwjhzhp/index.html" cn_nmpa_regulations
        continue-on-error: true

      # 3) 보조 HTML 소스 hash diff → source-status.json + detected-changes.json + .crawl-raw/
      - name: Crawl HTML sources
        run: npm run crawl
        continue-on-error: true

      # 3) Gemini 듀얼 파싱 (변경된 raw 만) → regulations.json + quarantine.json
      - name: Parse changed HTML sources
        run: npm run parse
        continue-on-error: true

      # 3-a) Claude 가 원문 대조로 추출한 한도/조건 override 반영 — 모든 소스 갱신 후 적용해
      # daily 재인입이 덮어쓰지 못하게(durable). limit-overrides.json 기준 멱등.
      - name: Apply curated limit overrides
        run: node scripts/apply-overrides.cjs
        continue-on-error: true

      # 3-a-1.5) 색소 identity 병합(결정론·자가치유) — us:colors(21 CFR)·andean fetcher 가 만든
      # 단독 색소명 orphan(예 "D&C Red No. 34")을 같은 designation 의 검색가능 colorant(복합명·CI번호)에
      # 병합. 권위 US/Andean 허용표가 검색카드·foreign-permit 검증에 보이게 함(유일매칭만, 멱등).
      - name: Merge fragmented color identities
        run: node scripts/color-identity-merge.cjs --apply
        continue-on-error: true

      # 3-a-1.6) identity 분절 병합(결정론·자가치유) — byte-동일 inci_name 으로 쪼개진 동일물질 다중 entry
      # (특히 JP 파서가 성분당 ~11 중복 생성)를 대표로 통합. 안전: 합의CAS 1개 or 전부無 + korean ≤1종만
      # (CAS충돌=다른form 보존=분별력). 검색 시 한 성분이 여러 카드로 쪼개지지 않게 함.
      - name: Merge fragmented identities (exact-name)
        run: node scripts/identity-name-merge.cjs --apply
        continue-on-error: true

      # 3-a-2) 품질 가디언(결정론·안전) — 모든 파서·override 후 실행. 불가능 농도값(>100/≤0) 제거 +
      # 오염 성분명·국가 행수 급감 flag(quarantine-names.json / guardian-baseline.json). 한도는 만들지 않음.
      - name: Quality guardian (self-heal + flag)
        run: node scripts/quality-guardian.cjs
        continue-on-error: true

      # 3-a-3) 교차출처 일관성 감사(결정론·無Gemini) — EU 법적채택국(ASEAN6·Andean4)·Mercosur 가
      # 같은 물질에 다른 권위 status 면 표면화(cross-source-divergences.json 검토큐). 자동교정 안 함
      # (관할권 차이는 실제 법 — 분별력). 신규 desync 급증 = 파서 regression 조기경보.
      - name: Cross-source consistency audit (review queue)
        run: node scripts/cross-source-consistency.cjs --write
        continue-on-error: true

      # 3-b) 데이터 품질 자동 점검 — 지표 계산 + 직전(quality-report.json) 대비 회귀 감지.
      # quality-report.json 갱신은 아래 commit 에 포함되어 추이가 장기 추적됨.
      - name: Data quality check
        id: quality
        run: node scripts/data-quality-check.cjs
        continue-on-error: true

      # 회귀(커버리지 급감=parser 파손 / 충돌·한도누락 급증) 시 Issue 자동 생성 — 전자동 자가신고.
      - name: Open data-quality regression issue
        if: steps.quality.outcome == 'failure'
        # 자가신고는 부가기능 — 실패해도 런(데이터 갱신)을 절대 죽이지 않는다.
        continue-on-error: true
        # GITHUB_TOKEN 사용(permissions.issues:write 보유). GH_PAT 는 Contents-only fine-grained 라
        # Issues 쓰기 불가("Resource not accessible by personal access token") → github.token 으로 고정.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="🟠 데이터 품질 회귀 감지"
          STAMP="$(date -u +%Y-%m-%dT%H:%MZ)"
          BODY="data-quality-check 가 직전 대비 회귀를 감지했습니다(${STAMP}). Actions 로그의 'Data quality check' 스텝 출력 참조 — 커버리지 급감=parser 파손, status 충돌/한도누락 급증 등. quality-report.json 추이 확인."
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then gh issue comment "$EXISTING" --body "$BODY"; else gh issue create --title "$TITLE" --body "$BODY"; fi

      # 4) 변경분 commit + push
      # always(): 앞 단계 일부가 실패해도 그때까지 갱신된 데이터는 커밋·push (부분 진전 보존).
      - name: Commit data changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/
          if git diff --cached --quiet; then
            echo "no data changes"
            exit 0
          fi
          git commit -m "chore(data): daily refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          # 충돌 안전 재시도: 동시 run(enrich/identity)이 같은 public/data 를 push 해 origin 이
          # 앞서가면 단순 push/rebase 가 충돌로 실패 → 가디언 클린 데이터가 커밋 안 되던 버그(실측 #26).
          # merge -X ours = 이번 run 이 갓 생성·클린한 데이터를 우선 채택(동시 run 의 변경은 그쪽 run 이
          # 자체 재적용). 6회 재시도. 이래야 매일 가디언 self-heal 이 반드시 반영(장기 정확도 유지).
          for i in 1 2 3 4 5 6; do
            if git push; then echo "pushed"; exit 0; fi
            echo "push 충돌 — fetch+merge(-X ours) 재시도 $i"
            git fetch origin main
            git merge -X ours --no-edit origin/main || { git merge --abort || true; git reset --hard HEAD; }
            sleep 4
          done
          echo "::error::push 6회 실패"; exit 1

      - name: Upload raw snapshots (for audit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-raw-${{ github.run_id }}
          path: .crawl-raw/
          retention-days: 14
          if-no-files-found: ignore
