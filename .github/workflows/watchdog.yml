name: Data Freshness Watchdog

# 일일 갱신(crawl.yml)이 조용히 멈추거나(키 만료·소스 변경·파싱 버그) 데이터가
# 비정상 급감하면 — 사람이 모르고 지나치지 않도록 GitHub Issue 로 자동 경보.
# crawl 이후 시각에 점검. (주의: Actions 자체가 60일 무활동 disable 되면 이 워치독도
#  안 도므로, 그 케이스는 crawl.yml 의 GH_PAT push 로만 방지됨 — 별개 안전장치.)

on:
  schedule:
    - cron: "0 21 * * *" # 매일 KST 06:00 (crawl 03:17 KST 이후)
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read   # gh run list (PR Check 게이트 건강 점검)

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check data freshness + sanity floors
        id: check
        env:
          MAX_AGE_DAYS: "3"
        run: |
          node -e '
            const fs = require("fs");
            const out = process.env.GITHUB_OUTPUT;
            const meta = JSON.parse(fs.readFileSync("public/data/meta.json", "utf8"));
            const ageDays = (Date.now() - new Date(meta.generated_at).getTime()) / 86400000;
            const c = meta.counts || {};
            const maxAge = Number(process.env.MAX_AGE_DAYS || 3);
            const problems = [];
            if (ageDays > maxAge) problems.push(`데이터 ${ageDays.toFixed(1)}일째 미갱신 (generated_at=${meta.generated_at}) — 일일 갱신 중단 가능`);
            if ((c.ingredients || 0) < 30000) problems.push(`원료 수 비정상 급감: ${c.ingredients} (정상 ~33,900)`);
            if ((c.regulations || 0) < 80000) problems.push(`규제 수 비정상 급감: ${c.regulations} (정상 ~92,000)`);
            if ((c.countries || 0) < 19) problems.push(`국가 수 비정상: ${c.countries} (정상 19)`);
            if (problems.length) {
              fs.appendFileSync(out, "alert=true\n");
              fs.appendFileSync(out, "body<<WD_EOF\n" + problems.map((p) => "- " + p).join("\n") + "\nWD_EOF\n");
              console.log("::warning title=Watchdog::\n" + problems.join("\n"));
            } else {
              fs.appendFileSync(out, "alert=false\n");
              console.log(`OK — 데이터 ${ageDays.toFixed(1)}일 전 갱신 / 원료 ${c.ingredients} / 규제 ${c.regulations} / ${c.countries}국`);
            }
          '

      # CI 품질게이트 건강 점검 — PR Check(E2E) 가 조용히 깨져도(예: Playwright install
      # 15분 hang→timeout, 2026-06-08 사례) 데이터 freshness 만 보던 워치독이 못 잡던 사각 보완.
      - name: Check CI gate health (PR Check on main)
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 최근 '완료된' main(push) PR Check 의 결론만 본다(in_progress/대기 제외). 빈값·none·null·
          # 진행중은 전부 무경보 — *확정된 나쁜 결론*에만 경보(워치독은 모호성에 false-alarm 금지).
          CONCL=$(gh run list --workflow="PR Check" --branch main --event push --status completed --limit 1 --json conclusion --jq '.[0].conclusion // ""' 2>/dev/null || echo "")
          echo "PR Check 최근 완료 main(push) 결론: [${CONCL}]"
          case "$CONCL" in
            failure|cancelled|timed_out|startup_failure)
              echo "alert=true" >> "$GITHUB_OUTPUT"
              echo "body=- CI 품질게이트(PR Check) 최근 완료 main 런 = ${CONCL} — E2E 게이트가 깨졌을 수 있음(Actions → PR Check 확인)." >> "$GITHUB_OUTPUT" ;;
            *)
              echo "alert=false" >> "$GITHUB_OUTPUT"
              echo "body=" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Open or update alert issue
        if: steps.check.outputs.alert == 'true' || steps.ci.outputs.alert == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: "${{ steps.check.outputs.body }}${{ steps.ci.outputs.body }}"
        run: |
          TITLE="🚨 데이터 갱신 워치독 경보"
          STAMP="$(date -u +%Y-%m-%dT%H:%MZ)"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "${STAMP} 재확인 — 여전히 이상:
          ${BODY}"
          else
            gh issue create --title "$TITLE" \
              --body "자동 워치독이 ${STAMP} 에 이상을 감지했습니다:

          ${BODY}

          **점검 순서**: 1) Actions → \"Daily Data Refresh\" 최근 런 실패/disable 여부 2) secret(MFDS_API_KEY/GEMINI_API_KEY) 만료 3) 소스 사이트 구조 변경. 정상화되면 이 이슈는 수동 close."
          fi
